name: Deploy skeleton

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      deploy-ready: ${{ steps.preflight.outputs.deploy-ready }}
    steps:
      - name: Deployment preflight
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_DEPLOY_TARGET: ${{ vars.BOT_DEPLOY_TARGET }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured. Skipping deploy before any platform command."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured. Skipping deploy before any platform command."
            missing=1
          fi
          if [ -z "$BOT_DEPLOY_TARGET" ]; then
            echo "BOT_DEPLOY_TARGET is intentionally pending. See docs/deploy/decisions/bot-deploy-target-pending.md."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "deploy-ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy-ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    if: needs.preflight.outputs.deploy-ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build before deploy
        run: pnpm build

      - name: Deploy placeholder
        run: |
          echo "Deploy target is configured, but platform-specific deploy commands are intentionally not implemented in this skeleton."
          echo "Add target-specific commands after documenting the Bot deploy target decision."
