name: Deploy

on:
  workflow_dispatch:

env:
  PNPM_VERSION: 10.25.0
  WRANGLER_VERSION: "4"

permissions:
  contents: read

jobs:
  preflight:
    name: Deploy preflight
    runs-on: ubuntu-latest
    outputs:
      cloudflare_ready: ${{ steps.preflight.outputs.cloudflare_ready }}
      bot_target_configured: ${{ steps.preflight.outputs.bot_target_configured }}
      smoke_ready: ${{ steps.preflight.outputs.smoke_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        id: preflight
        env:
          API_SMOKE_URL: ${{ vars.API_SMOKE_URL }}
          BOT_DEPLOY_TARGET: ${{ vars.BOT_DEPLOY_TARGET }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          NVIDIA_NIM_BEARER_TOKEN: ${{ secrets.NVIDIA_NIM_BEARER_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          WEB_SMOKE_URL: ${{ vars.WEB_SMOKE_URL }}
        run: |
          missing=0

          require_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          }

          require_var() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub Actions variable: $name"
              missing=1
            fi
          }

          require_secret CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          require_secret CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          require_secret CF_ACCESS_CLIENT_ID "$CF_ACCESS_CLIENT_ID"
          require_secret CF_ACCESS_CLIENT_SECRET "$CF_ACCESS_CLIENT_SECRET"
          require_secret NVIDIA_NIM_BEARER_TOKEN "$NVIDIA_NIM_BEARER_TOKEN"

          require_var CF_ACCESS_AUD "$CF_ACCESS_AUD"
          require_var CF_ACCESS_TEAM_DOMAIN "$CF_ACCESS_TEAM_DOMAIN"
          require_var CLOUDFLARE_D1_DATABASE_NAME "$CLOUDFLARE_D1_DATABASE_NAME"
          require_var CLOUDFLARE_D1_DATABASE_ID "$CLOUDFLARE_D1_DATABASE_ID"
          require_var CLOUDFLARE_PAGES_PROJECT_NAME "$CLOUDFLARE_PAGES_PROJECT_NAME"
          require_var LLM_PROVIDER "$LLM_PROVIDER"
          require_var VITE_API_BASE_URL "$VITE_API_BASE_URL"

          if [ "$LLM_PROVIDER" != "nvidia_nim" ]; then
            echo "::error::Production deploy requires LLM_PROVIDER=nvidia_nim."
            missing=1
          fi

          if grep -Eq 'ALLOW_LOCAL_AUTH_BYPASS[[:space:]]*=[[:space:]]*"true"' apps/api/wrangler.toml; then
            echo "::error::Production Wrangler config must not enable ALLOW_LOCAL_AUTH_BYPASS."
            missing=1
          fi

          if [ -n "$BOT_DEPLOY_TARGET" ]; then
            echo "bot_target_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BOT_DEPLOY_TARGET is intentionally pending. See docs/deploy/decisions/bot-deploy-target-pending.md."
            echo "bot_target_configured=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$API_SMOKE_URL" ] && [ -n "$WEB_SMOKE_URL" ]; then
            echo "smoke_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::API_SMOKE_URL and WEB_SMOKE_URL are optional. Smoke check will be skipped until both are configured."
            echo "smoke_ready=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$missing" -eq 1 ]; then
            echo "cloudflare_ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "cloudflare_ready=true" >> "$GITHUB_OUTPUT"

  d1_migrations:
    name: Apply D1 migrations
    needs: preflight
    if: needs.preflight.outputs.cloudflare_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check forward-only migration policy
        run: |
          if find packages/data/migrations -type f -name '*down*.sql' | grep -q .; then
            echo "::error::Down migration files are not allowed. Add a forward-fix migration instead."
            exit 1
          fi
          if grep -RniE '^--[[:space:]]*down\b' packages/data/migrations; then
            echo "::error::Down migration sections are not allowed. Production D1 migrations are forward-only."
            exit 1
          fi
          echo "Forward-only migration policy check passed."

      - name: Patch Wrangler D1 binding
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          config = Path("apps/api/wrangler.toml")
          text = config.read_text(encoding="utf-8")
          text = text.replace('database_name = "dc-chatbot-production"', f'database_name = "{os.environ["CLOUDFLARE_D1_DATABASE_NAME"]}"')
          text = text.replace('database_id = "00000000-0000-0000-0000-000000000000"', f'database_id = "{os.environ["CLOUDFLARE_D1_DATABASE_ID"]}"')
          config.write_text(text, encoding="utf-8")
          PY

      - name: Apply forward-only D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
        run: pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config apps/api/wrangler.toml

  deploy_api:
    name: Deploy API Worker
    needs: d1_migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @dc-chatbot/api build

      - name: Patch Wrangler production config
        env:
          API_WORKER_NAME: ${{ vars.API_WORKER_NAME }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          NVIDIA_NIM_BASE_URL: ${{ vars.NVIDIA_NIM_BASE_URL }}
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          config = Path("apps/api/wrangler.toml")
          text = config.read_text(encoding="utf-8")
          worker_name = os.environ.get("API_WORKER_NAME") or "dc-chatbot-api"
          text = text.replace('name = "dc-chatbot-api"', f'name = "{worker_name}"')
          text = text.replace('database_name = "dc-chatbot-production"', f'database_name = "{os.environ["CLOUDFLARE_D1_DATABASE_NAME"]}"')
          text = text.replace('database_id = "00000000-0000-0000-0000-000000000000"', f'database_id = "{os.environ["CLOUDFLARE_D1_DATABASE_ID"]}"')
          text = text.replace('CF_ACCESS_TEAM_DOMAIN = "replace-with-team.cloudflareaccess.com"', f'CF_ACCESS_TEAM_DOMAIN = {json.dumps(os.environ["CF_ACCESS_TEAM_DOMAIN"])}')
          text = text.replace('CF_ACCESS_AUD = "replace-with-access-application-aud"', f'CF_ACCESS_AUD = {json.dumps(os.environ["CF_ACCESS_AUD"])}')
          text = text.replace('LLM_PROVIDER = "fake"', f'LLM_PROVIDER = {json.dumps(os.environ["LLM_PROVIDER"])}')
          if os.environ.get("NVIDIA_NIM_BASE_URL"):
              text = text.replace('# NVIDIA_NIM_BASE_URL = "https://integrate.api.nvidia.com/v1"', f'NVIDIA_NIM_BASE_URL = {json.dumps(os.environ["NVIDIA_NIM_BASE_URL"])}')
          config.write_text(text, encoding="utf-8")
          PY

      - name: Deploy API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} deploy --config apps/api/wrangler.toml

      - name: Upload Worker secrets
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NVIDIA_NIM_BEARER_TOKEN: ${{ secrets.NVIDIA_NIM_BEARER_TOKEN }}
        run: |
          printf '%s' "$CF_ACCESS_CLIENT_ID" | pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} secret put CF_ACCESS_CLIENT_ID --config apps/api/wrangler.toml
          printf '%s' "$CF_ACCESS_CLIENT_SECRET" | pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} secret put CF_ACCESS_CLIENT_SECRET --config apps/api/wrangler.toml
          printf '%s' "$NVIDIA_NIM_BEARER_TOKEN" | pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} secret put NVIDIA_NIM_BEARER_TOKEN --config apps/api/wrangler.toml

  deploy_web:
    name: Deploy Web Pages
    needs: deploy_api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm --filter @dc-chatbot/web build

      - name: Deploy Web Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} pages deploy apps/web/dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch "$GITHUB_REF_NAME"

  bot_deploy_placeholder:
    name: Bot deploy placeholder
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Explain Bot deploy status
        env:
          BOT_DEPLOY_TARGET_CONFIGURED: ${{ needs.preflight.outputs.bot_target_configured }}
        run: |
          if [ "$BOT_DEPLOY_TARGET_CONFIGURED" = "true" ]; then
            echo "::error::BOT_DEPLOY_TARGET is configured, but no target-specific Bot deploy job exists yet."
            echo "Document the target and replace this placeholder before deploying apps/bot."
            exit 1
          fi
          echo "Bot deploy target is intentionally pending. See docs/deploy/decisions/bot-deploy-target-pending.md and apps/bot/deploy/README.md."

  smoke:
    name: Smoke check
    needs:
      - preflight
      - deploy_api
      - deploy_web
    if: needs.preflight.outputs.smoke_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check API and Web endpoints
        env:
          API_SMOKE_URL: ${{ vars.API_SMOKE_URL }}
          WEB_SMOKE_URL: ${{ vars.WEB_SMOKE_URL }}
        run: |
          api_health_url="${API_SMOKE_URL%/}/health"
          curl --fail --silent --show-error --max-time 20 "$api_health_url" > /dev/null
          curl --fail --silent --show-error --max-time 20 "$WEB_SMOKE_URL" > /dev/null
          echo "Smoke checks passed."
