name = "dc-chatbot-api-local"
main = "src/worker.ts"
compatibility_date = "2026-06-20"

# Local development only. Production deploy uses apps/api/wrangler.toml.
[vars]
DC_CHATBOT_ENV = "development"
ALLOW_LOCAL_AUTH_BYPASS = "true"
CF_ACCESS_CLIENT_ID = "local-dev-client-id"
CF_ACCESS_CLIENT_SECRET = "local-dev-client-secret"
LLM_PROVIDER = "fake"

[[d1_databases]]
binding = "DB"
database_name = "dc-chatbot-local"
database_id = "local-dev"
migrations_dir = "../../packages/data/migrations"
