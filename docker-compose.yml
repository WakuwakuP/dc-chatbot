services:
  api:
    image: node:24.22.1-bookworm-slim
    init: true
    working_dir: /workspace
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile &&
      {
      printf 'LOCAL_AUTH_BYPASS_SECRET=%s\n' "$$LOCAL_AUTH_BYPASS_SECRET";
      [ -n "$$LLM_PROVIDER" ] && printf 'LLM_PROVIDER=%s\n' "$$LLM_PROVIDER";
      [ -n "$$NVIDIA_NIM_BEARER_TOKEN" ] && printf 'NVIDIA_NIM_BEARER_TOKEN=%s\n' "$$NVIDIA_NIM_BEARER_TOKEN";
      [ -n "$$NVIDIA_NIM_BASE_URL" ] && printf 'NVIDIA_NIM_BASE_URL=%s\n' "$$NVIDIA_NIM_BASE_URL";
      } > apps/api/.dev.vars &&
      pnpm --filter @dc-chatbot/api dev:prepare &&
      pnpm --filter @dc-chatbot/api dev"
    environment:
      ALLOW_LOCAL_AUTH_BYPASS: "true"
      CI: "true"
      DC_CHATBOT_ENV: development
      LOCAL_AUTH_BYPASS_SECRET: ${LOCAL_AUTH_BYPASS_SECRET:-local-auth-bypass-secret}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-local-dev-client-id}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-local-dev-client-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      NVIDIA_NIM_BEARER_TOKEN: ${NVIDIA_NIM_BEARER_TOKEN:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8787/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    image: node:24.22.1-bookworm-slim
    init: true
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @dc-chatbot/web dev"
    environment:
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VITE_API_BASE_URL: http://localhost:8787
      VITE_API_PROXY_TARGET: http://api:8787
      VITE_DEV_ACCESS_SUBJECT: ${VITE_DEV_ACCESS_SUBJECT:-local-dev-owner@example.com}
      VITE_DEV_OWNER_DISCORD_USER_ID: ${VITE_DEV_OWNER_DISCORD_USER_ID:-999999999999999999}
      VITE_DEV_OWNER_ROLE: ${VITE_DEV_OWNER_ROLE:-admin_owner}
      VITE_LOCAL_AUTH_BYPASS_SECRET: ${LOCAL_AUTH_BYPASS_SECRET:-local-auth-bypass-secret}
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:5173'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  bot:
    image: node:24.22.1-bookworm-slim
    profiles:
      - bot
    init: true
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @dc-chatbot/bot dev"
    environment:
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-local-dev-client-id}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-local-dev-client-secret}
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      DC_CHATBOT_ALLOW_DEV_BOT: "true"
      DC_CHATBOT_ALLOW_PRODUCTION_BOT_TOKEN: "false"
      DC_CHATBOT_API_BASE_URL: http://api:8787
      DC_CHATBOT_ENV: development
      LOCAL_AUTH_BYPASS_SECRET: ${LOCAL_AUTH_BYPASS_SECRET:-local-auth-bypass-secret}
      DISCORD_DEV_ALLOWED_USER_IDS: ${DISCORD_DEV_ALLOWED_USER_IDS:-}
      DISCORD_DEV_GUILD_ID: ${DISCORD_DEV_GUILD_ID:-}
      DISCORD_DEV_TOKEN: ${DISCORD_DEV_TOKEN:-}
      # Never forward a production Bot token from the host into local Compose.
      DISCORD_TOKEN: ""
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      api:
        condition: service_healthy

volumes:
  node-modules:
  pnpm-store:
